name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - $default-branch

# Qodana replaces SonarCloud for code quality and security scanning.
# You need a Qodana Cloud project and its token added as a repository secret
# named QODANA_TOKEN: https://qodana.cloud - ask on the #itops Slack channel
# if you don't have admin access. Until the secret exists, the scan is skipped.
#
# Also copy qodana.config.yaml.example (in this folder) to qodana.yaml in your
# repository root and set the linter for your language - without it Qodana runs
# its full default profile instead of the security-scoped one.
env:
  QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        if: ${{ env.QODANA_TOKEN }}
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # 2026.1.3
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
